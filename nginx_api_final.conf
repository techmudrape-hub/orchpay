upstream flask_backend {
    server 127.0.0.1:5000;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name api.orchpay.in;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name api.orchpay.in;

    # SSL Configuration - using wildcard certificate
    ssl_certificate /etc/letsencrypt/live/admin.moneyone.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.moneyone.co.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # Security headers ONLY (NO CORS - Flask handles it)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Flask backend
    location / {
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DO NOT handle OPTIONS here - let Flask-CORS handle it
        # Removed: if ($request_method = 'OPTIONS') { return 204; }

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve uploaded files
    location /uploads/ {
        alias /var/www/moneyone/moneyone/backend/uploads/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Logs
    access_log /var/log/nginx/api.orchpay.in.access.log;
    error_log /var/log/nginx/api.orchpay.in.error.log;
}
