server {
    listen 80;
    server_name api.orchpay.in;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.orchpay.in;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/api.orchpay.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.orchpay.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers removed - Flask-CORS handles this
    # DO NOT add Access-Control-Allow-* headers here

    # Logging
    access_log /var/log/nginx/api.orchpay.in.access.log;
    error_log /var/log/nginx/api.orchpay.in.error.log;

    # Client body size
    client_max_body_size 10M;

    location / {
        # Proxy to Flask backend
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Handle preflight requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}
